<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المالية والمهام</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --red: #ef4444;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; }

    /* Login Box */
    .login-box {
      max-width: 400px; margin: 80px auto; background: var(--card-bg);
      padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;
    }
    .login-box input {
      width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border);
      border-radius: 8px; text-align: center; font-size: 18px; outline: none;
    }

    /* Header & Navigation */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .nav-tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .tab-btn {
      padding: 10px 18px; border: none; background: none; font-size: 15px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Cards & Grids */
    .section-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
    
    .item-card {
      background: var(--card-bg); border-radius: 10px; padding: 15px;
      border: 1px solid var(--border); border-right: 4px solid var(--primary);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .item-card.border-red { border-right-color: var(--red); }
    .item-card.border-green { border-right-color: var(--green); }

    /* UI Elements */
    .btn {
      padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-sub { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge-red { background: #fee2e2; color: #dc2626; }
    .badge-green { background: #d1fae5; color: #059669; }

    .progress-bar { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-fill { background: var(--primary); height: 100%; transition: width 0.3s; }

    /* Modals */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; }
    .modal-content input, .modal-content select {
      width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- واجهة تسجيل الدخول -->
  <div id="login-section" class="login-box">
    <h2>تسجيل الدخول</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">أدخل رمز PIN للمتابعة</p>
    <input type="password" id="pin-input" placeholder="****" maxlength="8">
    <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="handleLogin()">دخول</button>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="app-section" style="display: none;">
    
    <header>
      <h2>نظام الإدارة المالية</h2>
      <button class="btn btn-sub" onclick="handleLogout()">تسجيل الخروج</button>
    </header>

    <!-- شريط التبويبات -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('entries-tab', this)">الحركات المالية</button>
      <button class="tab-btn" onclick="switchTab('fixed-tab', this)">المصاريف الثابتة</button>
      <button class="tab-btn" onclick="switchTab('debts-tab', this)">الديون والمستحقات</button>
    </div>

    <!-- 1. تبويب الحركات المالية -->
    <div id="entries-tab" class="tab-content">
      <div class="section-card">
        <div class="card-header">
          <h3>سجل الحركات المالية</h3>
          <button class="btn btn-primary" onclick="openModal('entry-modal')">+ حركة جديدة</button>
        </div>
        <div id="entries-list" class="cards-grid"></div>
      </div>
    </div>

    <!-- 2. تبويب المصاريف الثابتة -->
    <div id="fixed-tab" class="tab-content" style="display: none;">
      <div class="section-card">
        <div class="card-header">
          <h3>التزامات الشهر (المصاريف الثابتة)</h3>
          <button class="btn btn-primary" onclick="openModal('fixed-modal')">+ إضافة مصروف ثابت</button>
        </div>
        <div id="fixed-list" class="cards-grid"></div>
      </div>
    </div>

    <!-- 3. تبويب الديون والمستحقات -->
    <div id="debts-tab" class="tab-content" style="display: none;">
      <div class="section-card">
        <div class="card-header">
          <h3>سجل الديون والمستحقات</h3>
          <button class="btn btn-primary" onclick="openModal('debt-modal')">+ إضافة دين / حق</button>
        </div>
        <div id="debts-list" class="cards-grid"></div>
      </div>
    </div>

  </div>
</div>

<!-- Modal: إضافة حركة مالية -->
<div id="entry-modal" class="modal">
  <div class="modal-content">
    <h3>إضافة حركة مالية</h3>
    <select id="entry-type"><option value="expense">مصروف</option><option value="revenue">دخل</option></select>
    <input type="text" id="entry-title" placeholder="البيان (مثال: طعام، وقود)">
    <input type="number" id="entry-amount" placeholder="المبلغ">
    <input type="text" id="entry-wallet" placeholder="المحفظة (مثال: الرئيسية)">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="saveEntry()">حفظ</button>
      <button class="btn btn-sub" style="flex: 1;" onclick="closeModal('entry-modal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- Modal: إضافة مصروف ثابت -->
<div id="fixed-modal" class="modal">
  <div class="modal-content">
    <h3>إضافة مصروف ثابت</h3>
    <input type="text" id="fx-title" placeholder="اسم النفقة (مثال: إيجار البيت)">
    <input type="number" id="fx-amount" placeholder="المبلغ الشهري">
    <input type="number" id="fx-day" placeholder="يوم الاستحقاق في الشهر (1-31)">
    <input type="text" id="fx-wallet" placeholder="المحفظة">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="saveFixed()">حفظ</button>
      <button class="btn btn-sub" style="flex: 1;" onclick="closeModal('fixed-modal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- Modal: إضافة دين -->
<div id="debt-modal" class="modal">
  <div class="modal-content">
    <h3>إضافة دين / حق</h3>
    <input type="text" id="db-person" placeholder="اسم الشخص أو الجهة">
    <select id="db-type"><option value="give">دين عليّ (التزام)</option><option value="take">حق لي (مستحق)</option></select>
    <input type="number" id="db-total" placeholder="المبلغ الكلي">
    <input type="number" id="db-paid" placeholder="المبلغ المسدد حالياً" value="0">
    <input type="date" id="db-date">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-primary" style="flex: 1;" onclick="saveDebt()">حفظ</button>
      <button class="btn btn-sub" style="flex: 1;" onclick="closeModal('debt-modal')">إلغاء</button>
    </div>
  </div>
</div>

<script>
  // 🔴 ضع رابط تطبيق Google Apps Script الخاص بك هنا
  const API_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

  // إدارة الجلسة والتبويبات
  document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('app_token')) {
      showApp();
    }
  });

  async function handleLogin() {
    const pin = document.getElementById('pin-input').value;
    if (!pin) return alert('يرجى إدخال PIN');

    try {
      const res = await fetch(`${API_URL}?action=login&pin=${encodeURIComponent(pin)}`);
      const data = await res.json();
      if (data.result === 'success') {
        localStorage.setItem('app_token', data.token);
        showApp();
      } else {
        alert(data.message || 'رمز الدخول خاطئ');
      }
    } catch (e) { alert('حدث خطأ في الاتصال'); }
  }

  function handleLogout() {
    localStorage.removeItem('app_token');
    location.reload();
  }

  function showApp() {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
    loadEntries();
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).style.display = 'block';
    btn.classList.add('active');

    if (tabId === 'entries-tab') loadEntries();
    if (tabId === 'fixed-tab') loadFixed();
    if (tabId === 'debts-tab') loadDebts();
  }

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  // -------------------------------------------------------------
  // 1. إدارة الحركات المالية
  // -------------------------------------------------------------
  async function loadEntries() {
    const token = localStorage.getItem('app_token');
    const res = await fetch(`${API_URL}?action=list&token=${token}`);
    const data = await res.json();
    
    if (data.result === 'success') {
      const container = document.getElementById('entries-list');
      container.innerHTML = '';
      data.data.forEach(item => {
        container.innerHTML += `
          <div class="item-card ${item.type === 'expense' ? 'border-red' : 'border-green'}">
            <div>
              <strong>${item.category}</strong>
              <p style="font-size: 18px; font-weight: bold; margin: 5px 0;">${item.amount}</p>
              <small style="color: var(--text-muted);">${item.wallet || 'عام'}</small>
            </div>
            <button class="btn btn-sub" style="margin-top: 10px;" onclick="deleteEntry('${item.id}')">حذف</button>
          </div>
        `;
      });
    }
  }

  async function saveEntry() {
    const token = localStorage.getItem('app_token');
    const type = document.getElementById('entry-type').value;
    const category = document.getElementById('entry-title').value;
    const amount = document.getElementById('entry-amount').value;
    const wallet = document.getElementById('entry-wallet').value;

    await fetch(`${API_URL}?action=add&token=${token}&type=${type}&category=${encodeURIComponent(category)}&amount=${amount}&wallet=${encodeURIComponent(wallet)}`);
    closeModal('entry-modal');
    loadEntries();
  }

  async function deleteEntry(id) {
    const token = localStorage.getItem('app_token');
    await fetch(`${API_URL}?action=delete&token=${token}&id=${id}`);
    loadEntries();
  }

  // -------------------------------------------------------------
  // 2. إدارة المصاريف الثابتة
  // -------------------------------------------------------------
  async function loadFixed() {
    const token = localStorage.getItem('app_token');
    const res = await fetch(`${API_URL}?action=fixed_list&token=${token}`);
    const data = await res.json();
    
    if (data.result === 'success') {
      const container = document.getElementById('fixed-list');
      container.innerHTML = '';
      data.items.forEach(item => {
        container.innerHTML += `
          <div class="item-card">
            <div>
              <div style="display:flex; justify-between; align-items:center;">
                <strong>${item.title}</strong>
                <span class="badge badge-red">يوم ${item.dayOfMonth}</span>
              </div>
              <p style="font-size: 18px; font-weight: bold; margin: 10px 0;">${item.amount}</p>
              <small style="color: var(--text-muted);">${item.wallet || 'عام'}</small>
            </div>
            <div style="display:flex; gap: 5px; margin-top: 10px;">
              <button class="btn btn-primary" style="flex:1;" onclick="payFixed('${item.title}', ${item.amount}, '${item.wallet}')">تسديد كمصروف</button>
              <button class="btn btn-danger" onclick="deleteFixed('${item.id}')">حذف</button>
            </div>
          </div>
        `;
      });
    }
  }

  async function saveFixed() {
    const token = localStorage.getItem('app_token');
    const title = document.getElementById('fx-title').value;
    const amount = document.getElementById('fx-amount').value;
    const dayOfMonth = document.getElementById('fx-day').value;
    const wallet = document.getElementById('fx-wallet').value;

    await fetch(`${API_URL}?action=fixed_save&token=${token}&title=${encodeURIComponent(title)}&amount=${amount}&dayOfMonth=${dayOfMonth}&wallet=${encodeURIComponent(wallet)}`);
    closeModal('fixed-modal');
    loadFixed();
  }

  async function payFixed(title, amount, wallet) {
    const token = localStorage.getItem('app_token');
    await fetch(`${API_URL}?action=add&token=${token}&type=expense&category=${encodeURIComponent('تسديد: ' + title)}&amount=${amount}&wallet=${encodeURIComponent(wallet)}`);
    alert('تم تسديد المصروف وإضافته للحركات المالية!');
  }

  async function deleteFixed(id) {
    const token = localStorage.getItem('app_token');
    await fetch(`${API_URL}?action=fixed_delete&token=${token}&id=${id}`);
    loadFixed();
  }

  // -------------------------------------------------------------
  // 3. إدارة الديون والمستحقات
  // -------------------------------------------------------------
  async function loadDebts() {
    const token = localStorage.getItem('app_token');
    const res = await fetch(`${API_URL}?action=debts_list&token=${token}`);
    const data = await res.json();
    
    if (data.result === 'success') {
      const container = document.getElementById('debts-list');
      container.innerHTML = '';
      data.items.forEach(debt => {
        const isGive = debt.type === 'give';
        const remaining = debt.totalAmount - debt.paidAmount;
        const progress = Math.min(100, Math.round((debt.paidAmount / debt.totalAmount) * 100));

        container.innerHTML += `
          <div class="item-card ${isGive ? 'border-red' : 'border-green'}">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${debt.person}</strong>
                <span class="badge ${isGive ? 'badge-red' : 'badge-green'}">${isGive ? 'دين عليّ' : 'حق لي'}</span>
              </div>
              <p style="margin-top: 8px;">المبلغ: <strong>${debt.totalAmount}</strong> | المتبقي: <strong style="color:${isGive?'var(--red)':'var(--green)'}">${remaining}</strong></p>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%"></div>
              </div>
            </div>
            <button class="btn btn-danger" style="margin-top: 10px;" onclick="deleteDebt('${debt.id}')">حذف</button>
          </div>
        `;
      });
    }
  }

  async function saveDebt() {
    const token = localStorage.getItem('app_token');
    const person = document.getElementById('db-person').value;
    const type = document.getElementById('db-type').value;
    const totalAmount = document.getElementById('db-total').value;
    const paidAmount = document.getElementById('db-paid').value;
    const dueDate = document.getElementById('db-date').value;

    await fetch(`${API_URL}?action=debt_save&token=${token}&person=${encodeURIComponent(person)}&type=${type}&totalAmount=${totalAmount}&paidAmount=${paidAmount}&dueDate=${dueDate}`);
    closeModal('debt-modal');
    loadDebts();
  }

  async function deleteDebt(id) {
    const token = localStorage.getItem('app_token');
    await fetch(`${API_URL}?action=debt_delete&token=${token}&id=${id}`);
    loadDebts();
  }
</script>

</body>
</html>
